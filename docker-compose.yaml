version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastapi_base

volumes:
  postgres_data:
    name: postgres_data

networks:
  fastapi_base:
    name: fastapi_base