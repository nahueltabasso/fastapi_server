version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastapi_base

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./src:/opt/project/server/src
    env_file:
      - .env
    depends_on:
      - postgres
    restart: always
    networks:
      - fastapi_base

volumes:
  postgres_data:
    name: postgres_data

networks:
  fastapi_base:
    name: fastapi_base